<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zurich Foundation · Video Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --zurich-bg: #ffffff;
      --zurich-ink: #111111;
      --zurich-muted: #555555;
      --zurich-primary: #082A68; /* Exact brand blue */
      --zurich-accent: #B45A41;  /* Exact brand brown/terracotta */
      --zurich-border: #e0e0e0;
      --zurich-card-bg: #f8f9fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--zurich-bg); color: var(--zurich-ink); font-family: 'Public Sans', sans-serif; font-size: 16px; line-height: 1.5; }
    button, input { font: inherit; }
    #reelhouse-widget { max-width: 1152px; margin: 0 auto; }

    /* NAVIGATION WITH EXACT BRAND LOGO */
    .rh-nav { position: sticky; top: 0; z-index: 40; height: 76px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--zurich-border); background: rgba(255,255,255,.95); backdrop-filter: blur(8px); }
    .rh-brand { display: flex; align-items: center; text-decoration: none; }
    .rh-logo-img { height: 42px; width: auto; display: block; object-fit: contain; }

    .rh-main { padding: 48px 24px 80px; }
    .rh-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .rh-eyebrow { color: var(--zurich-accent); font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    .rh-title { margin-top: 6px; font-size: clamp(34px, 4.5vw, 48px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; color: var(--zurich-primary); }
    .rh-count { margin-top: 8px; color: var(--zurich-muted); font-size: 14px; }

    .rh-search-wrap { position: relative; width: 280px; flex: 0 0 280px; }
    .rh-search-icon { position: absolute; top: 50%; left: 14px; width: 16px; height: 16px; transform: translateY(-50%); color: #777; pointer-events: none; }
    .rh-search { width: 100%; height: 44px; padding: 0 16px 0 40px; border: 1px solid var(--zurich-border); border-radius: 4px; outline: none; background: #fff; color: var(--zurich-ink); font-size: 14px; transition: border-color .2s ease; }
    .rh-search:focus { border-color: var(--zurich-accent); }

    /* FAST FEATURED PLAYER */
    .rh-featured { margin-top: 32px; }
    .rh-feature-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 280px;
      max-height: 640px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 12px 36px rgba(0,0,0,.08);
    }
    .rh-feature-embed {
      position: absolute;
      top: -75px;
      left: 0;
      width: 100%;
      height: calc(100% + 150px);
      border: 0;
      background: #000;
    }

    .rh-fullscreen-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 20;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .rh-fullscreen-btn:hover { background: var(--zurich-accent); }

    .rh-gallery-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-top: 48px; }
    .rh-gallery-title { font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--zurich-primary); }
    .rh-gallery-subtitle { margin-top: 4px; color: var(--zurich-muted); font-size: 13px; }
    .rh-scroll-hint { flex-shrink: 0; color: var(--zurich-muted); font-size: 12px; }

    /* HORIZONTAL CARDS */
    .rh-grid { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 16px; width: 100%; margin-top: 16px; padding: 8px 4px 24px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #ccc transparent; }
    .rh-grid::-webkit-scrollbar { height: 6px; }
    .rh-grid::-webkit-scrollbar-track { background: transparent; }
    .rh-grid::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

    .rh-card { position: relative; display: block; flex: 0 0 clamp(220px, 25%, 260px); min-width: 0; padding: 10px; border: 1px solid var(--zurich-border); border-radius: 8px; background: var(--zurich-card-bg); color: var(--zurich-ink); text-align: left; cursor: pointer; scroll-snap-align: start; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .rh-card:hover { transform: translateY(-2px); border-color: var(--zurich-accent); box-shadow: 0 6px 20px rgba(0,0,0,.06); }
    .rh-card.is-selected { border-color: var(--zurich-accent); border-width: 2px; background: #fff; }

    .rh-frame { position: relative; width: 100%; overflow: hidden; aspect-ratio: 16 / 9; border-radius: 6px; background: #111; }
    .rh-thumb { display: block; width: 100%; height: 100%; object-fit: cover; border: 0; outline: none; }
    .rh-card-play { position: absolute; right: 12px; bottom: 12px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 4px; background: var(--zurich-accent); color: #fff; font-size: 11px; }

    .rh-card-caption { display: block; width: 100%; margin-top: 10px; }
    .rh-card-title { display: block; overflow: hidden; color: var(--zurich-ink); font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .rh-card-meta { display: block; margin-top: 2px; color: var(--zurich-muted); font-size: 12px; }

    .rh-error { margin-top: 24px; padding: 16px; border-radius: 6px; background: #fdf2f2; color: #991b1b; font-size: 14px; }
    .rh-empty { margin-top: 24px; color: var(--zurich-muted); font-size: 14px; }
    [hidden] { display: none !important; }

    @media (max-width: 640px) {
      .rh-nav { height: 60px; padding: 0 16px; }
      .rh-logo-img { height: 32px; }
      .rh-main { padding: 32px 16px 60px; }
      .rh-head { flex-direction: column; align-items: stretch; gap: 16px; }
      .rh-search-wrap { width: 100%; flex-basis: auto; }
    }
  </style>
</head>
<body>
  <div id="reelhouse-widget" data-api-base="https://script.google.com/macros/s/AKfycbyHh9H4rI91gZC5SeQiAK-9Qhjl930EX9JDfkJS7aDEJf9lvEuOCcb-BsJyP1Rn3oXy/exec">
    <header class="rh-nav">
      <a class="rh-brand" href="#">
        <!-- User's Uploaded Zurich Foundation Logo -->
        <img class="rh-logo-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA..." alt="Zurich Foundation Logo">
      </a>
    </header>

    <main class="rh-main">
      <section class="rh-gallery-view">
        <div class="rh-head">
          <div>
            <p class="rh-eyebrow">Where are you creating change?</p>
            <h1 class="rh-title">Mark your impact</h1>
            <p class="rh-count" aria-live="polite">Loading videos…</p>
          </div>
          <label class="rh-search-wrap">
            <svg class="rh-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
            <input class="rh-search" type="search" placeholder="Search videos" aria-label="Search videos">
          </label>
        </div>

        <section class="rh-featured" aria-label="Featured video">
          <div class="rh-feature-frame" id="rh-feature-frame">
            <iframe class="rh-feature-embed" id="rh-feature-embed" title="Featured video player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            <button type="button" class="rh-fullscreen-btn" id="rh-fs-btn" aria-label="Maximize screen">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </section>

        <div class="rh-gallery-heading">
          <div>
            <h2 class="rh-gallery-title">Impact stories</h2>
            <p class="rh-gallery-subtitle">Select a video to feature above.</p>
          </div>
          <p class="rh-scroll-hint">Scroll sideways →</p>
        </div>
        <div class="rh-error" role="alert" hidden></div>
        <div class="rh-grid" aria-label="Video gallery"></div>
        <p class="rh-empty" hidden>No videos have been uploaded yet.</p>
      </section>
    </main>
  </div>

  <script>
  (() => {
    const root = document.getElementById('reelhouse-widget');
    if (!root || root.dataset.initialized === '1') return;
    root.dataset.initialized = '1';

    const apiBase = root.dataset.apiBase;
    const grid = root.querySelector('.rh-grid');
    const countLabel = root.querySelector('.rh-count');
    const search = root.querySelector('.rh-search');
    const galleryError = root.querySelector('.rh-error');
    const emptyMessage = root.querySelector('.rh-empty');
    
    const featureEmbed = document.getElementById('rh-feature-embed');
    const featureFrame = document.getElementById('rh-feature-frame');
    const fsBtn = document.getElementById('rh-fs-btn');

    const items = new Map();
    let videoList = [];
    let currentIndex = 0;
    let rotationTimer = null;
    let refreshInProgress = false;

    // Fullscreen Toggle
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        featureFrame.requestFullscreen().catch(err => {
          console.warn('Fullscreen error:', err);
        });
      } else {
        document.exitFullscreen();
      }
    });

    function formatBytes(bytes) {
      const n = Number(bytes || 0);
      if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function dateText(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function getGoogleDriveId(rawUrl) {
      try {
        const url = new URL(rawUrl);
        if (/(^|\.)googleusercontent\.com$/i.test(url.hostname)) {
          const parts = url.pathname.split('/');
          const dIndex = parts.indexOf('d');
          if (dIndex !== -1 && parts[dIndex + 1]) return parts[dIndex + 1];
        }
        if (!/(^|\.)drive\.google\.com$/i.test(url.hostname) && !/(^|\.)docs\.google\.com$/i.test(url.hostname)) {
          return null;
        }
        const pathMatch = url.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (pathMatch) return pathMatch[1];
        const idParam = url.searchParams.get('id');
        if (idParam && /^[a-zA-Z0-9_-]+$/.test(idParam)) return idParam;
        return null;
      } catch (_) {
        return null;
      }
    }

    function highlightCard(id) {
      grid.querySelectorAll('.rh-card').forEach(card => {
        const selected = card.dataset.id === String(id);
        card.classList.toggle('is-selected', selected);
        card.setAttribute('aria-pressed', String(selected));
      });
      const selectedCard = Array.from(grid.querySelectorAll('.rh-card')).find(card => card.dataset.id === String(id));
      if (selectedCard) {
        selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      }
    }

    function selectVideo(item) {
      if (!item || !item.url) return;
      const id = String(item.id);
      currentIndex = videoList.findIndex(v => String(v.id) === id);
      if (currentIndex === -1) currentIndex = 0;

      highlightCard(id);

      const driveId = getGoogleDriveId(item.url) || item.id;
      featureEmbed.src = 'https://drive.google.com/file/d/' + encodeURIComponent(driveId) + '/preview?autoplay=1';

      setupRotationTimer();
    }

    function setupRotationTimer() {
      if (rotationTimer) clearInterval(rotationTimer);
      rotationTimer = setInterval(() => {
        if (videoList.length <= 1) return;
        currentIndex = (currentIndex + 1) % videoList.length;
        selectVideo(videoList[currentIndex]);
      }, 15000);
    }

    function createCard(item) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'rh-card';
      card.dataset.id = String(item.id);
      card.setAttribute('aria-pressed', 'false');
      card.setAttribute('aria-label', 'Play ' + (item.title || 'video'));

      const frame = document.createElement('div');
      frame.className = 'rh-frame';

      const driveId = getGoogleDriveId(item.url) || item.id;
      const img = document.createElement('img');
      img.className = 'rh-thumb';
      img.alt = item.title || 'Video preview';
      img.loading = 'lazy';
      img.src = 'https://lh3.googleusercontent.com/d/' + driveId;
      img.addEventListener('error', () => {
        img.src = 'https://drive.google.com/thumbnail?id=' + driveId + '&sz=w640';
      });

      const playIcon = document.createElement('span');
      playIcon.className = 'rh-card-play';
      playIcon.textContent = '▶';

      frame.append(img, playIcon);

      const caption = document.createElement('span');
      caption.className = 'rh-card-caption';

      const title = document.createElement('span');
      title.className = 'rh-card-title';
      title.textContent = item.title || 'Untitled video';

      const meta = document.createElement('span');
      meta.className = 'rh-card-meta';
      meta.textContent = dateText(item.date) + (item.size ? ' · ' + formatBytes(item.size) : '');

      caption.append(title, meta);
      card.append(frame, caption);

      card.addEventListener('click', () => {
        selectVideo(items.get(card.dataset.id) || item);
      });

      return card;
    }

    function renderFilter() {
      const query = search.value.trim().toLocaleLowerCase();
      let shown = 0;

      grid.querySelectorAll('.rh-card').forEach(card => {
        const item = items.get(card.dataset.id);
        const title = item ? item.title || '' : '';
        const matches = !query || title.toLocaleLowerCase().includes(query);
        card.hidden = !matches;
        if (matches) shown++;
      });

      countLabel.textContent = query && shown === 0
        ? 'No videos match your search'
        : shown + ' video' + (shown === 1 ? '' : 's') + ' · Zurich Foundation Gallery';

      emptyMessage.hidden = items.size !== 0;
    }

    search.addEventListener('input', renderFilter);

    async function refreshGallery() {
      if (refreshInProgress) return;
      refreshInProgress = true;

      try {
        if (!apiBase) throw new Error('Missing Google Apps Script Web App URL.');
        const response = await fetch(apiBase, { method: 'GET', cache: 'no-store' });
        if (!response.ok) throw new Error('Could not retrieve videos.');

        const body = await response.json();
        const videos = Array.isArray(body.videos) ? body.videos : [];
        videoList = videos;
        const incomingIds = new Set();

        videos.forEach(item => {
          if (!item || item.id == null || !item.url) return;
          const id = String(item.id);
          incomingIds.add(id);

          if (items.has(id)) {
            items.set(id, item);
            return;
          }

          items.set(id, item);
          grid.appendChild(createCard(item));
        });

        for (const [id] of items) {
          if (!incomingIds.has(id)) {
            const card = Array.from(grid.querySelectorAll('.rh-card')).find(el => el.dataset.id === id);
            if (card) card.remove();
            items.delete(id);
          }
        }

        if (!featureEmbed.src && videos.length > 0) {
          selectVideo(videos[0]);
        }

        galleryError.hidden = true;
        renderFilter();
      } catch (error) {
        galleryError.textContent = 'Could not load videos.';
        galleryError.hidden = false;
        countLabel.textContent = 'Unable to load videos';
      } finally {
        refreshInProgress = false;
      }
    }

    refreshGallery();
    window.setInterval(refreshGallery, 20000);
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reelhouse · Video Gallery</title>

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --rh-bg: #faf9f6;
      --rh-ink: #302c28;
      --rh-muted: #77716b;
      --rh-primary: #e96c3b;
      --rh-border: #e8e4df;
      --rh-player: #24211f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--rh-bg);
      color: var(--rh-ink);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    #reelhouse-widget {
      max-width: 1152px;
      margin: 0 auto;
    }

    /* HEADER */
    .rh-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(224, 220, 214, .8);
      background: rgba(250, 249, 246, .94);
      backdrop-filter: blur(8px);
    }

    .rh-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--rh-ink);
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .rh-brand-mark {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--rh-primary);
      color: #fff;
    }

    .rh-brand-mark svg {
      width: 14px;
      height: 14px;
      margin-left: 2px;
    }

    /* MAIN */
    .rh-main {
      padding: 42px 20px 96px;
    }

    .rh-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .rh-eyebrow {
      color: var(--rh-primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .rh-title {
      margin-top: 9px;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(38px, 5vw, 52px);
      font-weight: 800;
      letter-spacing: -.055em;
      line-height: 1.08;
    }

    .rh-count {
      margin-top: 9px;
      color: var(--rh-muted);
      font-size: 14px;
    }

    /* SEARCH */
    .rh-search-wrap {
      position: relative;
      width: 288px;
      flex: 0 0 288px;
    }

    .rh-search-icon {
      position: absolute;
      top: 50%;
      left: 14px;
      width: 16px;
      height: 16px;
      transform: translateY(-50%);
      color: #87827c;
      pointer-events: none;
    }

    .rh-search {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 40px;
      border: 1px solid var(--rh-border);
      border-radius: 999px;
      outline: none;
      background: #fff;
      color: var(--rh-ink);
      font: inherit;
      font-size: 14px;
    }

    .rh-search:focus {
      border-color: var(--rh-primary);
      box-shadow: 0 0 0 3px rgba(233, 108, 59, .12);
    }

    /* VIDEO GRID */
    .rh-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 24px;
      row-gap: 38px;
      margin-top: 36px;
    }

    .rh-card {
      min-width: 0;
      animation: rh-enter .4s ease both;
    }

    @keyframes rh-enter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .rh-frame {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      background: var(--rh-player);
      box-shadow: 0 1px 2px rgba(48, 44, 40, .06),
                  0 8px 24px -12px rgba(48, 44, 40, .18);
    }

    .rh-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--rh-player);
      border: 0;
      outline: none;
    }

    /* HIDE NATIVE VIDEO CONTROLS */
    .rh-video::-webkit-media-controls,
    .rh-video::-webkit-media-controls-enclosure,
    .rh-video::-webkit-media-controls-panel,
    .rh-video::-webkit-media-controls-play-button,
    .rh-video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none !important;
    }

    .rh-card-caption {
      display: block;
      width: 100%;
      margin-top: 11px;
      color: var(--rh-ink);
      text-align: left;
    }

    .rh-card-title {
      display: block;
      overflow: hidden;
      font-size: 15px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rh-card-meta {
      display: block;
      margin-top: 2px;
      color: var(--rh-muted);
      font-size: 13px;
    }

    .rh-error {
      margin-top: 32px;
      padding: 18px 20px;
      border-radius: 16px;
      background: #fce9e6;
      color: #a8352a;
      font-size: 14px;
    }

    .rh-empty {
      margin-top: 30px;
      color: var(--rh-muted);
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .rh-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .rh-nav {
        height: 60px;
        padding: 0 15px;
      }

      .rh-brand {
        font-size: 17px;
      }

      .rh-main {
        padding: 34px 15px 70px;
      }

      .rh-head {
        align-items: stretch;
        flex-direction: column;
        gap: 18px;
      }

      .rh-search-wrap {
        width: 100%;
        flex-basis: auto;
      }

      .rh-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 26px;
        margin-top: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rh-card {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div
    id="reelhouse-widget"
    data-api-base="https://script.google.com/macros/s/AKfycbyHh9H4rI91gZC5SeQiAK-9Qhjl930EX9JDfkJS7aDEJf9lvEuOCcb-BsJyP1Rn3oXy/exec"
  >
    <header class="rh-nav">
      <div class="rh-brand">
        <span class="rh-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 4.8c0-.78.85-1.26 1.52-.86l11.1 6.7a1 1 0 0 1 0 1.72l-11.1 6.7A1 1 0 0 1 7 18.2V4.8Z"/>
          </svg>
        </span>
        <span>Reelhouse</span>
      </div>
    </header>

    <main class="rh-main">
      <section class="rh-gallery-view">
        <div class="rh-head">
          <div>
            <p class="rh-eyebrow">Gallery</p>
            <h1 class="rh-title">Fresh reels</h1>
            <p class="rh-count" aria-live="polite">Loading videos…</p>
          </div>

          <label class="rh-search-wrap">
            <svg class="rh-search-icon" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8"/>
              <path d="m16 16 5 5"/>
            </svg>
            <input
              class="rh-search"
              type="search"
              placeholder="Search videos"
              aria-label="Search videos"
            >
          </label>
        </div>

        <div class="rh-error" hidden></div>
        <div class="rh-grid"></div>
        <p class="rh-empty" hidden>No videos have been uploaded yet.</p>
      </section>
    </main>
  </div>

  <script>
  (() => {
    const root = document.getElementById('reelhouse-widget');
    if (!root || root.dataset.initialized === '1') return;

    root.dataset.initialized = '1';

    const apiBase = root.dataset.apiBase;
    const grid = root.querySelector('.rh-grid');
    const countLabel = root.querySelector('.rh-count');
    const search = root.querySelector('.rh-search');
    const galleryError = root.querySelector('.rh-error');
    const emptyMessage = root.querySelector('.rh-empty');

    const items = new Map();
    let refreshInProgress = false;

    function formatBytes(bytes) {
      const n = Number(bytes || 0);

      if (n < 1024 * 1024) {
        return Math.max(1, Math.round(n / 1024)) + ' KB';
      }

      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function dateText(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return '';

      return date.toLocaleDateString(undefined, {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function attemptAutoplay(video) {
      // Muted autoplay is permitted by most modern browsers.
      video.muted = true;
      video.defaultMuted = true;
      video.autoplay = true;
      video.playsInline = true;
      video.controls = false;

      const result = video.play();

      if (result && typeof result.catch === 'function') {
        result.catch(error => {
          // No visible play button or controls.
          // Log the actual error for troubleshooting.
          console.warn(
            'Reelhouse autoplay failed:',
            video.currentSrc || video.src,
            error.name,
            error.message
          );
        });
      }
    }

    // Only attempt autoplay when a video is visible or close to view.
    const observer = 'IntersectionObserver' in window
      ? new IntersectionObserver(entries => {
          entries.forEach(entry => {
            const video = entry.target;

            if (entry.isIntersecting) {
              attemptAutoplay(video);
            } else {
              video.pause();
            }
          });
        }, {
          threshold: 0.15,
          rootMargin: '100px'
        })
      : null;

    function createCard(item) {
      const article = document.createElement('article');
      article.className = 'rh-card';
      article.dataset.id = String(item.id);

      const frame = document.createElement('div');
      frame.className = 'rh-frame';

      const video = document.createElement('video');
      video.className = 'rh-video';

      // Hide controls and prepare autoplay before assigning the source.
      video.autoplay = true;
      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;
      video.controls = false;
      video.preload = 'auto';

      video.setAttribute('muted', '');
      video.setAttribute('autoplay', '');
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.setAttribute('disablepictureinpicture', '');
      video.setAttribute('controlslist', 'nodownload nofullscreen noremoteplayback');
      video.setAttribute('aria-label', item.title || 'Uploaded video');

      video.addEventListener('loadedmetadata', () => {
        attemptAutoplay(video);
      });

      video.addEventListener('canplay', () => {
        attemptAutoplay(video);
      });

      video.addEventListener('error', () => {
        console.error(
          'Reelhouse video failed to load:',
          item.title,
          video.error ? video.error.code : 'Unknown error',
          video.currentSrc || video.src
        );
      });

      // Use the URL returned by your existing Google Apps Script.
      video.src = item.url;

      frame.appendChild(video);

      const caption = document.createElement('div');
      caption.className = 'rh-card-caption';

      const title = document.createElement('span');
      title.className = 'rh-card-title';
      title.textContent = item.title || 'Untitled video';

      const meta = document.createElement('span');
      meta.className = 'rh-card-meta';
      meta.textContent =
        dateText(item.date) +
        (item.size ? ' · ' + formatBytes(item.size) : '');

      caption.append(title, meta);
      article.append(frame, caption);

      if (observer) {
        observer.observe(video);
      } else {
        attemptAutoplay(video);
      }

      return article;
    }

    function renderFilter() {
      const query = search.value.trim().toLocaleLowerCase();
      let shown = 0;

      grid.querySelectorAll('.rh-card').forEach(card => {
        const item = items.get(card.dataset.id);
        const title = item ? item.title || '' : '';
        const matches = !query ||
          title.toLocaleLowerCase().includes(query);

        card.style.display = matches ? '' : 'none';

        const video = card.querySelector('video');

        if (video) {
          if (matches) {
            if (observer) {
              observer.unobserve(video);
              observer.observe(video);
            } else {
              attemptAutoplay(video);
            }
          } else {
            video.pause();
          }
        }

        if (matches) shown++;
      });

      if (query && shown === 0) {
        countLabel.textContent = 'No videos match your search';
      } else {
        countLabel.textContent =
          shown + ' video' + (shown === 1 ? '' : 's') +
          ' · live from Google Form uploads';
      }

      emptyMessage.hidden = items.size !== 0;
    }

    search.addEventListener('input', renderFilter);

    async function refreshGallery() {
      if (refreshInProgress) return;
      refreshInProgress = true;

      try {
        if (!apiBase) {
          throw new Error('Missing Google Apps Script Web App URL.');
        }

        const response = await fetch(apiBase, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(
            'Could not retrieve videos. HTTP status: ' + response.status
          );
        }

        const body = await response.json();

        if (body.error) {
          throw new Error(body.error);
        }

        const videos = Array.isArray(body.videos) ? body.videos : [];
        const incomingIds = new Set();

        videos.forEach(item => {
          if (!item || item.id == null || !item.url) return;

          const id = String(item.id);
          incomingIds.add(id);

          // Keep existing video elements so playback is not interrupted.
          if (items.has(id)) {
            items.set(id, item);

            const existingCard = grid.querySelector(
              '.rh-card[data-id="' + CSS.escape(id) + '"]'
            );

            if (existingCard) {
              const title = existingCard.querySelector('.rh-card-title');
              const meta = existingCard.querySelector('.rh-card-meta');

              if (title) {
                title.textContent = item.title || 'Untitled video';
              }

              if (meta) {
                meta.textContent =
                  dateText(item.date) +
                  (item.size ? ' · ' + formatBytes(item.size) : '');
              }
            }

            return;
          }

          items.set(id, item);

          // New uploads appear at the beginning of the gallery.
          const card = createCard(item);
          grid.prepend(card);
        });

        // Remove files that no longer exist in the returned folder listing.
        for (const [id] of items) {
          if (!incomingIds.has(id)) {
            const card = grid.querySelector(
              '.rh-card[data-id="' + CSS.escape(id) + '"]'
            );

            if (card) {
              const video = card.querySelector('video');

              if (video) {
                if (observer) observer.unobserve(video);
                video.pause();
                video.removeAttribute('src');
                video.load();
              }

              card.remove();
            }

            items.delete(id);
          }
        }

        galleryError.hidden = true;
        renderFilter();

      } catch (error) {
        console.error('Reelhouse gallery error:', error);

        galleryError.textContent =
          error.message || 'Could not load videos. Please try again later.';

        galleryError.hidden = false;

        // Do not clear already loaded videos when a refresh fails.
        if (items.size === 0) {
          countLabel.textContent = 'Unable to load videos';
        }
      } finally {
        refreshInProgress = false;
      }
    }

    // Load videos as soon as the page opens.
    refreshGallery();

    // Check for new Google Form uploads without interrupting current videos.
    window.setInterval(refreshGallery, 20000);

    // Retry autoplay when a visitor returns to the browser tab.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        grid.querySelectorAll('.rh-card video').forEach(video => {
          if (video.getBoundingClientRect().bottom > 0 &&
              video.getBoundingClientRect().top < window.innerHeight) {
            attemptAutoplay(video);
          }
        });
      }
    });

  })();
  </script>
</body>
</html>

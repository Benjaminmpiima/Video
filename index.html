<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reelhouse · Video Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rh-bg: #faf9f6;
      --rh-ink: #302c28;
      --rh-muted: #77716b;
      --rh-primary: #e96c3b;
      --rh-border: #e8e4df;
      --rh-player: #24211f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--rh-bg); color: var(--rh-ink); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5; }
    button, input { font: inherit; }
    #reelhouse-widget { max-width: 1152px; margin: 0 auto; }

    .rh-nav { position: sticky; top: 0; z-index: 40; height: 64px; padding: 0 20px; display: flex; align-items: center; border-bottom: 1px solid rgba(224,220,214,.8); background: rgba(250,249,246,.94); backdrop-filter: blur(8px); }
    .rh-brand { display: flex; align-items: center; gap: 9px; color: var(--rh-ink); font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 800; letter-spacing: -.04em; }
    .rh-brand-mark { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; background: var(--rh-primary); color: #fff; }
    .rh-brand-mark svg { width: 14px; height: 14px; margin-left: 2px; }

    .rh-main { padding: 42px 20px 80px; }
    .rh-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .rh-eyebrow { color: var(--rh-primary); font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .rh-title { margin-top: 9px; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(38px,5vw,52px); font-weight: 800; letter-spacing: -.055em; line-height: 1.08; }
    .rh-count { margin-top: 9px; color: var(--rh-muted); font-size: 14px; }

    .rh-search-wrap { position: relative; width: 288px; flex: 0 0 288px; }
    .rh-search-icon { position: absolute; top: 50%; left: 14px; width: 16px; height: 16px; transform: translateY(-50%); color: #87827c; pointer-events: none; }
    .rh-search { width: 100%; height: 44px; padding: 0 16px 0 40px; border: 1px solid var(--rh-border); border-radius: 999px; outline: none; background: #fff; color: var(--rh-ink); font-size: 14px; transition: border-color .2s ease, box-shadow .2s ease; }
    .rh-search:focus { border-color: var(--rh-primary); box-shadow: 0 0 0 3px rgba(233,108,59,.12); }

    /* FEATURED PLAYER */
    .rh-featured { margin-top: 34px; }
    .rh-feature-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 8.2;
      min-height: 280px;
      max-height: 660px;
      overflow: hidden;
      border-radius: 24px;
      background: #171614;
      box-shadow:
        0 16px 48px rgba(35,29,24,.13),
        0 0 0 1px rgba(233,108,59,.16),
        0 0 28px rgba(233,108,59,.10);
    }
    .rh-feature-video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #171614;
      border: 0;
      outline: none;
      pointer-events: none; /* Completely disables clicking/hover controls */
    }

    /* Completely hide native video controls across all browsers */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none !important;
    }

    .rh-gallery-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-top: 42px; }
    .rh-gallery-title { font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(22px,3vw,28px); font-weight: 800; letter-spacing: -.035em; }
    .rh-gallery-subtitle { margin-top: 5px; color: var(--rh-muted); font-size: 13px; }
    .rh-scroll-hint { flex-shrink: 0; color: var(--rh-muted); font-size: 12px; }

    /* HORIZONTAL VIDEO CARDS */
    .rh-grid { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 16px; width: 100%; margin-top: 18px; padding: 12px 5px 24px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #d6cfc7 transparent; }
    .rh-grid::-webkit-scrollbar { height: 6px; }
    .rh-grid::-webkit-scrollbar-track { background: transparent; }
    .rh-grid::-webkit-scrollbar-thumb { background: #d6cfc7; border-radius: 999px; }

    .rh-card { position: relative; display: block; flex: 0 0 clamp(210px,25%,260px); min-width: 0; padding: 8px; border: 1px solid transparent; border-radius: 16px; background: transparent; color: var(--rh-ink); text-align: left; cursor: pointer; scroll-snap-align: start; animation: rh-enter .4s ease both; transition: transform .22s ease,border-color .22s ease,box-shadow .22s ease,background .22s ease; }
    .rh-card:hover { transform: translateY(-3px); background: #fff; box-shadow: 0 8px 24px rgba(35,29,24,.08),0 0 16px rgba(233,108,59,.12); }
    .rh-card.is-selected { border-color: var(--rh-primary); background: #fff; box-shadow: 0 0 0 2px rgba(233,108,59,.14),0 0 22px rgba(233,108,59,.20); }
    .rh-card:focus-visible { outline: 2px solid var(--rh-primary); outline-offset: 3px; }
    @keyframes rh-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .rh-frame { position: relative; width: 100%; overflow: hidden; aspect-ratio: 16 / 9; border-radius: 10px; background: var(--rh-player); }
    .rh-video { display: block; width: 100%; height: 100%; object-fit: cover; background: var(--rh-player); border: 0; outline: none; pointer-events: none; }
    .rh-card-play { position: absolute; right: 10px; bottom: 10px; display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; transition: background .2s ease,transform .2s ease; }
    .rh-card:hover .rh-card-play, .rh-card.is-selected .rh-card-play { background: var(--rh-primary); transform: scale(1.06); }
    .rh-card-caption { display: block; width: 100%; margin-top: 11px; text-align: left; }
    .rh-card-title { display: block; overflow: hidden; color: var(--rh-ink); font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .rh-card-meta { display: block; margin-top: 3px; color: var(--rh-muted); font-size: 12px; }

    .rh-error { margin-top: 25px; padding: 16px 18px; border-radius: 14px; background: #fce9e6; color: #a8352a; font-size: 14px; }
    .rh-empty { margin-top: 25px; color: var(--rh-muted); font-size: 14px; }
    [hidden] { display: none !important; }

    @media (max-width: 900px) {
      .rh-card { flex-basis: 240px; }
      .rh-feature-frame { aspect-ratio: 16 / 9; }
    }
    @media (max-width: 640px) {
      .rh-nav { height: 60px; padding: 0 15px; }
      .rh-brand { font-size: 17px; }
      .rh-main { padding: 34px 15px 60px; }
      .rh-head { align-items: stretch; flex-direction: column; gap: 18px; }
      .rh-search-wrap { width: 100%; flex-basis: auto; }
      .rh-featured { margin-top: 26px; }
      .rh-feature-frame { aspect-ratio: 4 / 3; min-height: 220px; border-radius: 16px; }
      .rh-gallery-heading { align-items: flex-start; flex-direction: column; gap: 5px; margin-top: 32px; }
      .rh-card { flex-basis: 210px; }
      .rh-grid { gap: 12px; }
    }
  </style>
</head>
<body>
  <div id="reelhouse-widget" data-api-base="https://script.google.com/macros/s/AKfycbyHh9H4rI91gZC5SeQiAK-9Qhjl930EX9JDfkJS7aDEJf9lvEuOCcb-BsJyP1Rn3oXy/exec">
    <header class="rh-nav">
      <div class="rh-brand">
        <span class="rh-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8c0-.78.85-1.26 1.52-.86l11.1 6.7a1 1 0 0 1 0 1.72l-11.1 6.7A1 1 0 0 1 7 18.2V4.8Z"/></svg>
        </span>
        <span>Reelhouse</span>
      </div>
    </header>

    <main class="rh-main">
      <section class="rh-gallery-view">
        <div class="rh-head">
          <div>
            <p class="rh-eyebrow">Gallery</p>
            <h1 class="rh-title">Fresh reels</h1>
            <p class="rh-count" aria-live="polite">Loading videos…</p>
          </div>
          <label class="rh-search-wrap">
            <svg class="rh-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
            <input class="rh-search" type="search" placeholder="Search videos" aria-label="Search videos">
          </label>
        </div>

        <section class="rh-featured" aria-label="Featured video">
          <div class="rh-feature-frame">
            <video class="rh-feature-video" autoplay muted playsinline preload="auto"></video>
          </div>
        </section>

        <div class="rh-gallery-heading">
          <div>
            <h2 class="rh-gallery-title">Explore videos</h2>
            <p class="rh-gallery-subtitle">Select a reel to play it above.</p>
          </div>
          <p class="rh-scroll-hint">Scroll sideways →</p>
        </div>
        <div class="rh-error" role="alert" hidden></div>
        <div class="rh-grid" aria-label="Video gallery"></div>
        <p class="rh-empty" hidden>No videos have been uploaded yet.</p>
      </section>
    </main>
  </div>

  <script>
  (() => {
    const root = document.getElementById('reelhouse-widget');
    if (!root || root.dataset.initialized === '1') return;
    root.dataset.initialized = '1';

    const apiBase = root.dataset.apiBase;
    const grid = root.querySelector('.rh-grid');
    const countLabel = root.querySelector('.rh-count');
    const search = root.querySelector('.rh-search');
    const galleryError = root.querySelector('.rh-error');
    const emptyMessage = root.querySelector('.rh-empty');
    const featuredVideo = root.querySelector('.rh-feature-video');

    const items = new Map();
    let videoList = [];
    let currentIndex = 0;
    let refreshInProgress = false;

    function formatBytes(bytes) {
      const n = Number(bytes || 0);
      if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function dateText(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function selectVideo(item) {
      if (!item || !item.url) return;
      const id = String(item.id);
      currentIndex = videoList.findIndex(v => String(v.id) === id);
      if (currentIndex === -1) currentIndex = 0;

      grid.querySelectorAll('.rh-card').forEach(card => {
        const selected = card.dataset.id === id;
        card.classList.toggle('is-selected', selected);
        card.setAttribute('aria-pressed', String(selected));
      });

      featuredVideo.pause();
      featuredVideo.removeAttribute('src');
      featuredVideo.load();
      featuredVideo.src = item.url;
      featuredVideo.load();
      featuredVideo.play().catch(() => {});

      const selectedCard = Array.from(grid.querySelectorAll('.rh-card')).find(card => card.dataset.id === id);
      if (selectedCard) {
        selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      }
    }

    featuredVideo.addEventListener('canplay', () => {
      featuredVideo.play().catch(() => {});
    });

    featuredVideo.addEventListener('ended', () => {
      if (videoList.length === 0) return;
      currentIndex = (currentIndex + 1) % videoList.length;
      selectVideo(videoList[currentIndex]);
    });

    function createCard(item) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'rh-card';
      card.dataset.id = String(item.id);
      card.setAttribute('aria-pressed', 'false');
      card.setAttribute('aria-label', 'Play ' + (item.title || 'video'));

      const frame = document.createElement('div');
      frame.className = 'rh-frame';

      const video = document.createElement('video');
      video.className = 'rh-video';
      video.muted = true;
      video.loop = false;
      video.playsInline = true;
      video.preload = 'metadata';
      video.src = item.url;

      const playIcon = document.createElement('span');
      playIcon.className = 'rh-card-play';
      playIcon.textContent = '▶';

      frame.append(video, playIcon);

      const caption = document.createElement('span');
      caption.className = 'rh-card-caption';

      const title = document.createElement('span');
      title.className = 'rh-card-title';
      title.textContent = item.title || 'Untitled video';

      const meta = document.createElement('span');
      meta.className = 'rh-card-meta';
      meta.textContent = dateText(item.date) + (item.size ? ' · ' + formatBytes(item.size) : '');

      caption.append(title, meta);
      card.append(frame, caption);

      card.addEventListener('click', () => {
        selectVideo(items.get(card.dataset.id) || item);
      });

      return card;
    }

    function renderFilter() {
      const query = search.value.trim().toLocaleLowerCase();
      let shown = 0;

      grid.querySelectorAll('.rh-card').forEach(card => {
        const item = items.get(card.dataset.id);
        const title = item ? item.title || '' : '';
        const matches = !query || title.toLocaleLowerCase().includes(query);
        card.hidden = !matches;
        if (matches) shown++;
      });

      countLabel.textContent = query && shown === 0
        ? 'No videos match your search'
        : shown + ' video' + (shown === 1 ? '' : 's') + ' · live from Google Form uploads';

      emptyMessage.hidden = items.size !== 0;
    }

    search.addEventListener('input', renderFilter);

    async function refreshGallery() {
      if (refreshInProgress) return;
      refreshInProgress = true;

      try {
        if (!apiBase) throw new Error('Missing Google Apps Script Web App URL.');
        const response = await fetch(apiBase, { method: 'GET', cache: 'no-store' });
        if (!response.ok) throw new Error('Could not retrieve videos.');

        const body = await response.json();
        const videos = Array.isArray(body.videos) ? body.videos : [];
        videoList = videos;
        const incomingIds = new Set();

        videos.forEach(item => {
          if (!item || item.id == null || !item.url) return;
          const id = String(item.id);
          incomingIds.add(id);

          if (items.has(id)) {
            items.set(id, item);
            return;
          }

          items.set(id, item);
          grid.appendChild(createCard(item));
        });

        for (const [id] of items) {
          if (!incomingIds.has(id)) {
            const card = Array.from(grid.querySelectorAll('.rh-card')).find(el => el.dataset.id === id);
            if (card) card.remove();
            items.delete(id);
          }
        }

        if (!featuredVideo.src && videos.length > 0) {
          selectVideo(videos[0]);
        }

        galleryError.hidden = true;
        renderFilter();
      } catch (error) {
        galleryError.textContent = 'Could not load videos.';
        galleryError.hidden = false;
        countLabel.textContent = 'Unable to load videos';
      } finally {
        refreshInProgress = false;
      }
    }

    refreshGallery();
    window.setInterval(refreshGallery, 20000);
  })();
  </script>
</body>
</html>

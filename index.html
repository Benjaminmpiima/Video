<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reelhouse · Video Portal & Uploads</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@750&family=Inter:wght@400;550;600;650;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --rh-bg: #faf9f6;
        --rh-ink: #302c28;
        --rh-muted: #77716b;
        --rh-primary: #e96c3b;
        --rh-border: #e8e4df;
        --rh-card: #fff;
        --rh-player: #24211f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: var(--rh-bg);
        color: var(--rh-ink);
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      button, input { font: inherit; }

      #reelhouse-widget {
        max-width: 1152px;
        margin: 0 auto;
      }

      /* Navigation Header */
      .rh-nav {
        position: sticky;
        top: 0;
        z-index: 40;
        height: 64px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(224, 220, 214, .8);
        background: rgba(250, 249, 246, .92);
        backdrop-filter: blur(8px);
      }
      .rh-brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--rh-ink);
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 19px;
        font-weight: 750;
        letter-spacing: -.04em;
        text-decoration: none;
      }
      .rh-brand-mark {
        width: 29px;
        height: 29px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: var(--rh-primary);
        color: #fff;
      }
      .rh-brand-mark svg { width: 14px; height: 14px; margin-left: 2px; }
      .rh-tabs {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 4px;
        border: 1px solid var(--rh-border);
        border-radius: 999px;
        background: #fff;
      }
      .rh-tab {
        min-height: 31px;
        padding: 5px 16px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #77716b;
        font-size: 13px;
        font-weight: 550;
        cursor: pointer;
        transition: all .15s ease;
      }
      .rh-tab:hover { color: var(--rh-ink); }
      .rh-tab[aria-selected="true"] { background: var(--rh-ink); color: #fff; }

      /* Main Layout */
      .rh-main { padding: 48px 20px 96px; }
      .rh-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
      .rh-eyebrow { margin: 0; color: var(--rh-primary); font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      .rh-title {
        margin: 9px 0 0;
        color: var(--rh-ink);
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: clamp(38px, 5vw, 52px);
        font-weight: 750;
        letter-spacing: -.055em;
        line-height: 1.08;
      }
      .rh-count { margin: 9px 0 0; color: var(--rh-muted); font-size: 14px; }
      .rh-search-wrap { position: relative; width: 288px; flex: 0 0 288px; }
      .rh-search-icon {
        position: absolute;
        top: 50%;
        left: 14px;
        width: 16px;
        height: 16px;
        transform: translateY(-50%);
        color: #87827c;
        pointer-events: none;
      }
      .rh-search {
        width: 100%;
        height: 44px;
        padding: 0 16px 0 40px;
        border: 1px solid var(--rh-border);
        border-radius: 999px;
        outline: none;
        background: #fff;
        color: var(--rh-ink);
        font-size: 14px;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      .rh-search:focus { border-color: var(--rh-primary); box-shadow: 0 0 0 3px rgba(233, 108, 59, .12); }

      /* Grid & Video Cards */
      .rh-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 24px; row-gap: 38px; margin-top: 40px; }
      .rh-card { min-width: 0; animation: rh-enter .42s ease both; }
      @keyframes rh-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .rh-frame {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16/9;
        border-radius: 16px;
        background: var(--rh-player);
        box-shadow: 0 1px 2px rgba(48, 44, 40, .06), 0 8px 24px -12px rgba(48, 44, 40, .18);
        transition: box-shadow .22s ease;
      }
      .rh-card:hover .rh-frame { box-shadow: 0 2px 4px rgba(48, 44, 40, .08), 0 18px 40px -16px rgba(48, 44, 40, .3); }
      .rh-video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--rh-player); }
      .rh-play-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border: 0;
        background: rgba(20, 18, 17, .22);
        color: #fff;
        cursor: pointer;
        opacity: 0;
        transition: opacity .18s ease;
      }
      .rh-play-overlay.rh-show { opacity: 1; }
      .rh-play-circle {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--rh-primary);
        color: #fff;
        box-shadow: 0 5px 18px rgba(0, 0, 0, .22);
      }
      .rh-play-circle svg { width: 24px; height: 24px; margin-left: 3px; }
      .rh-tools {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 30px 11px 10px;
        background: linear-gradient(transparent, rgba(0, 0, 0, .78));
        color: white;
        opacity: 0;
        transition: opacity .18s ease;
      }
      .rh-frame:hover .rh-tools, .rh-frame:focus-within .rh-tools { opacity: 1; }
      .rh-control {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        padding: 0;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }
      .rh-control:hover { background: rgba(255, 255, 255, .18); }
      .rh-control svg { width: 17px; height: 17px; }
      .rh-progress { min-width: 30px; flex: 1; height: 4px; accent-color: var(--rh-primary); cursor: pointer; }
      .rh-time { flex: 0 0 auto; color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; }
      .rh-volume { width: 52px; height: 4px; flex: 0 0 52px; accent-color: var(--rh-primary); cursor: pointer; }
      .rh-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 30px;
        height: 30px;
        margin: -15px;
        border: 3px solid rgba(255, 255, 255, .35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: rh-spin .8s linear infinite;
        pointer-events: none;
      }
      @keyframes rh-spin { to { transform: rotate(360deg); } }
      .rh-full {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 29px;
        height: 29px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: rgba(28, 25, 23, .62);
        color: #fff;
        cursor: pointer;
        opacity: 0;
        transition: opacity .18s ease;
      }
      .rh-frame:hover .rh-full, .rh-frame:focus-within .rh-full { opacity: 1; }
      .rh-full svg { width: 15px; height: 15px; }
      .rh-card-caption {
        display: block;
        width: 100%;
        margin-top: 11px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--rh-ink);
        text-align: left;
        cursor: pointer;
      }
      .rh-card-title { display: block; overflow: hidden; font-size: 15px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .rh-card-meta { display: block; margin-top: 2px; color: var(--rh-muted); font-size: 13px; }
      .rh-error { margin-top: 32px; padding: 18px 20px; border-radius: 16px; background: #fce9e6; color: #a8352a; font-size: 14px; }

      /* Upload Panel & Form */
      .rh-upload-view { display: none; }
      .rh-upload-panel {
        max-width: 760px;
        margin: 5px auto 0;
        padding: clamp(24px, 5vw, 44px);
        border: 1px solid var(--rh-border);
        border-radius: 25px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(48, 44, 40, .04), 0 15px 42px -24px rgba(48, 44, 40, .18);
      }
      .rh-upload-title {
        margin: 0;
        color: var(--rh-ink);
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: clamp(28px, 4vw, 38px);
        font-weight: 750;
        letter-spacing: -.045em;
        line-height: 1.15;
      }
      .rh-upload-copy { margin: 9px 0 25px; color: var(--rh-muted); font-size: 14px; }
      .rh-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
      .rh-field-full { grid-column: span 2; }
      .rh-input-group { display: flex; flex-direction: column; gap: 6px; }
      .rh-input-group label { font-size: 13px; font-weight: 600; color: var(--rh-ink); }
      .rh-input {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid var(--rh-border);
        border-radius: 12px;
        background: #fbfaf8;
        color: var(--rh-ink);
        font-size: 14px;
        outline: none;
        transition: border-color .18s, background .18s;
      }
      .rh-input:focus { border-color: var(--rh-primary); background: #fff; box-shadow: 0 0 0 3px rgba(233, 108, 59, .12); }
      .rh-drop {
        display: flex;
        min-height: 200px;
        align-items: center;
        justify-content: center;
        padding: 25px;
        border: 1.5px dashed #d6d0c8;
        border-radius: 18px;
        background: #fbfaf8;
        text-align: center;
        cursor: pointer;
        outline: none;
        transition: border-color .18s, background .18s;
      }
      .rh-drop:hover, .rh-drop.rh-drag { border-color: var(--rh-primary); background: #fff8f4; }
      .rh-drop-inner { pointer-events: none; }
      .rh-drop-icon {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        margin: 0 auto 14px;
        border-radius: 17px;
        background: rgba(233, 108, 59, .12);
        color: var(--rh-primary);
      }
      .rh-drop-icon svg { width: 25px; height: 25px; }
      .rh-drop strong { display: block; margin-bottom: 5px; font-size: 16px; }
      .rh-drop small { color: var(--rh-muted); font-size: 13px; }
      .rh-selected { display: none; margin-top: 14px; padding: 12px 14px; border: 1px solid var(--rh-border); border-radius: 12px; background: #fbfaf8; font-size: 13px; overflow-wrap: anywhere; }
      .rh-preview { display: none; width: 100%; max-height: 320px; margin-top: 14px; border-radius: 13px; background: var(--rh-player); object-fit: contain; }
      .rh-upload-actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
      .rh-button {
        min-height: 44px;
        padding: 11px 18px;
        border: 0;
        border-radius: 999px;
        background: var(--rh-primary);
        color: white;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
        transition: filter .15s ease;
      }
      .rh-button:hover { filter: brightness(.96); }
      .rh-button:disabled { opacity: .48; cursor: not-allowed; }
      .rh-cancel { display: none; background: #efede9; color: var(--rh-ink); }
      .rh-progress-wrap { display: none; margin-top: 17px; }
      .rh-progress-head { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--rh-muted); font-size: 12px; }
      .rh-progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: #eeeae5; }
      .rh-progress-bar { width: 0; height: 100%; border-radius: inherit; background: var(--rh-primary); }
      .rh-status { min-height: 22px; margin: 13px 0 0; color: var(--rh-muted); font-size: 13px; }
      .rh-status[data-kind="error"] { color: #b42318; }
      .rh-status[data-kind="success"] { color: #067647; }

      @media (max-width: 900px) { .rh-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 640px) {
        .rh-nav { height: 60px; padding: 0 15px; }
        .rh-brand { font-size: 17px; }
        .rh-tab { padding-right: 12px; padding-left: 12px; font-size: 12px; }
        .rh-main { padding: 34px 15px 70px; }
        .rh-head { align-items: stretch; flex-direction: column; gap: 18px; }
        .rh-search-wrap { width: 100%; }
        .rh-grid { grid-template-columns: minmax(0, 1fr); gap: 26px; margin-top: 28px; }
        .rh-form-grid { grid-template-columns: minmax(0, 1fr); }
        .rh-field-full { grid-column: span 1; }
      }
    </style>
</head>
<body>

  <div id="reelhouse-widget" data-api-base="https://script.google.com/macros/s/AKfycbyHh9H4rI91gZC5SeQiAK-9Qhjl930EX9JDfkJS7aDEJf9lvEuOCcb-BsJyP1Rn3oXy/exec">
    <header class="rh-nav">
      <div class="rh-brand">
        <span class="rh-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8c0-.78.85-1.26 1.52-.86l11.1 6.7a1 1 0 0 1 0 1.72l-11.1 6.7A1 1 0 0 1 7 18.2V4.8Z"/></svg>
        </span>
        <span>Reelhouse</span>
      </div>
      <nav class="rh-tabs" aria-label="Main navigation">
        <button class="rh-tab" type="button" data-view="upload" aria-selected="false">Upload</button>
        <button class="rh-tab" type="button" data-view="gallery" aria-selected="true">Gallery</button>
      </nav>
    </header>

    <main class="rh-main">
      <!-- GALLERY VIEW -->
      <section class="rh-gallery-view">
        <div class="rh-head">
          <div>
            <p class="rh-eyebrow">Gallery</p>
            <h1 class="rh-title">Fresh reels</h1>
            <p class="rh-count" aria-live="polite">Loading videos…</p>
          </div>
          <label class="rh-search-wrap">
            <svg class="rh-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
            <input class="rh-search" type="search" placeholder="Search videos" aria-label="Search videos">
          </label>
        </div>
        <div class="rh-error" hidden></div>
        <div class="rh-grid" aria-live="polite"></div>
      </section>

      <!-- UPLOAD VIEW -->
      <section class="rh-upload-view">
        <div class="rh-upload-panel">
          <h1 class="rh-upload-title">Upload a video</h1>
          <p class="rh-upload-copy">Provide your contact details and upload a video file. MP4, WebM, or MOV, up to 50 MB.</p>
          
          <form class="rh-form">
            <div class="rh-form-grid">
              <div class="rh-input-group">
                <label for="rh-user-name">Full Name *</label>
                <input class="rh-input" id="rh-user-name" type="text" placeholder="John Doe" required>
              </div>
              <div class="rh-input-group">
                <label for="rh-user-phone">Phone Number *</label>
                <input class="rh-input" id="rh-user-phone" type="tel" placeholder="+1 (555) 000-0000" required>
              </div>
              <div class="rh-input-group rh-field-full">
                <label for="rh-user-address">Address *</label>
                <input class="rh-input" id="rh-user-address" type="text" placeholder="123 Main Street, City" required>
              </div>
            </div>

            <input class="rh-file-input" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" hidden>
            
            <div class="rh-drop" role="button" tabindex="0" aria-label="Choose a video file or drop one here">
              <div class="rh-drop-inner">
                <span class="rh-drop-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg>
                </span>
                <strong>Drop your video here</strong>
                <small>or click to browse your device</small>
              </div>
            </div>
            
            <div class="rh-selected"></div>
            <video class="rh-preview" controls playsinline muted></video>
            
            <div class="rh-upload-actions">
              <button class="rh-button rh-submit" type="submit" disabled>Upload video</button>
              <button class="rh-button rh-cancel" type="button">Cancel upload</button>
            </div>
            
            <div class="rh-progress-wrap" aria-live="polite">
              <div class="rh-progress-head"><span>Uploading</span><span class="rh-percent">0%</span></div>
              <div class="rh-progress-track" role="progressbar" aria-label="Video upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="rh-progress-bar"></div></div>
            </div>
            <p class="rh-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script>
  (() => {
    const root = document.getElementById('reelhouse-widget');
    if (!root || root.dataset.initialized === '1') return;
    root.dataset.initialized = '1';
    
    const apiBase = root.dataset.apiBase || '';
    const galleryView = root.querySelector('.rh-gallery-view');
    const uploadView = root.querySelector('.rh-upload-view');
    const tabs = [...root.querySelectorAll('.rh-tab')];
    const grid = root.querySelector('.rh-grid');
    const countLabel = root.querySelector('.rh-count');
    const search = root.querySelector('.rh-search');
    const galleryError = root.querySelector('.rh-error');
    
    const form = root.querySelector('.rh-form');
    const userNameInput = root.querySelector('#rh-user-name');
    const userPhoneInput = root.querySelector('#rh-user-phone');
    const userAddressInput = root.querySelector('#rh-user-address');
    
    const fileInput = root.querySelector('.rh-file-input');
    const drop = root.querySelector('.rh-drop');
    const selectedLabel = root.querySelector('.rh-selected');
    const preview = root.querySelector('.rh-preview');
    const submit = root.querySelector('.rh-submit');
    const cancel = root.querySelector('.rh-cancel');
    const status = root.querySelector('.rh-status');
    const progressWrap = root.querySelector('.rh-progress-wrap');
    const progressBar = root.querySelector('.rh-progress-bar');
    const progressTrack = root.querySelector('.rh-progress-track');
    const percent = root.querySelector('.rh-percent');
    
    const maxBytes = 50 * 1024 * 1024;
    const items = new Map();
    const ratios = new Map();
    let selectedFile = null;
    let activeVideo = null;
    let observer = null;

    function setStatus(text, kind) { status.textContent = text || ''; status.dataset.kind = kind || ''; }
    function formatBytes(bytes) {
      const n = Number(bytes || 0);
      if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }
    function formatTime(value) {
      if (!Number.isFinite(value)) return '0:00';
      const minutes = Math.floor(value / 60);
      const seconds = Math.floor(value % 60).toString().padStart(2, '0');
      return minutes + ':' + seconds;
    }
    function dateText(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString(undefined, {month:'short',day:'numeric',year:'numeric'});
    }
    function showView(view) {
      const upload = view === 'upload';
      galleryView.style.display = upload ? 'none' : 'block';
      uploadView.style.display = upload ? 'block' : 'none';
      tabs.forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.view === view)));
      if (upload) window.scrollTo({top: root.getBoundingClientRect().top + window.scrollY, behavior:'smooth'});
    }
    
    tabs.forEach(tab => tab.addEventListener('click', () => showView(tab.dataset.view)));
    search.addEventListener('input', renderFilter);

    function setPlayOverlay(button, visible) { button.classList.toggle('rh-show', visible); }
    function pauseAll(except) {
      root.querySelectorAll('.rh-video').forEach(video => { if (video !== except) video.pause(); });
    }
    function attemptPlay(video, overlay) {
      pauseAll(video);
      video.muted = true;
      activeVideo = video;
      const promise = video.play();
      if (promise && promise.catch) promise.catch(() => setPlayOverlay(overlay, true));
    }
    function createIcon(name) {
      const paths = {
        play:'<path d="m8 5 12 7-12 7V5Z" fill="currentColor" stroke="none"/>',
        pause:'<path d="M8 5h3v14H8zM15 5h3v14h-3z" fill="currentColor" stroke="none"/>',
        volume:'<path d="M4 10v4h3l4 3V7l-4 3H4Z"/><path d="M15 9a5 5 0 0 1 0 6M17.5 6.5a9 9 0 0 1 0 11"/>',
        mute:'<path d="M4 10v4h3l4 3V7l-4 3H4Z"/><path d="m16 9 5 6m0-6-5 6"/>',
        full:'<path d="M8 3H3v5m0-5 6 6m7-6h5v5m0-5-6 6M3 16v5h5m-5 0 6-6m10 1v5h-5m5 0-6-6"/>'
      };
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','2'); svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round'); svg.innerHTML = paths[name];
      return svg;
    }
    function makeButton(className, label, icon) {
      const button = document.createElement('button'); button.type='button'; button.className=className; button.setAttribute('aria-label',label); button.title=label; if(icon) button.append(createIcon(icon)); return button;
    }
    function createCard(item) {
      const article = document.createElement('article'); article.className='rh-card'; article.dataset.id=String(item.id);
      const frame = document.createElement('div'); frame.className='rh-frame';
      const video = document.createElement('video'); video.className='rh-video'; video.src=item.url; video.playsInline=true; video.muted=true; video.loop=true; video.preload='metadata'; video.setAttribute('aria-label',item.title || 'Uploaded video');
      const playOverlay = document.createElement('button'); playOverlay.type='button'; playOverlay.className='rh-play-overlay'; playOverlay.setAttribute('aria-label','Play video');
      const playCircle=document.createElement('span');playCircle.className='rh-play-circle';playCircle.append(createIcon('play'));playOverlay.append(playCircle);
      const spinner=document.createElement('span');spinner.className='rh-spinner';spinner.hidden=true;spinner.setAttribute('aria-label','Loading video');
      const fullscreen=makeButton('rh-full','Open fullscreen','full');
      const tools=document.createElement('div');tools.className='rh-tools';
      const playButton=makeButton('rh-control','Play','play');
      const timeline=document.createElement('input');timeline.type='range';timeline.min='0';timeline.max='1000';timeline.value='0';timeline.className='rh-progress';timeline.setAttribute('aria-label','Seek video');
      const time=document.createElement('span');time.className='rh-time';time.textContent='0:00';
      const muteButton=makeButton('rh-control','Unmute video','mute');
      const volume=document.createElement('input');volume.type='range';volume.min='0';volume.max='1';volume.step='0.05';volume.value='1';volume.className='rh-volume';volume.setAttribute('aria-label','Video volume');
      tools.append(playButton,timeline,time,muteButton,volume);frame.append(video,playOverlay,spinner,fullscreen,tools);
      
      const caption=document.createElement('button');caption.type='button';caption.className='rh-card-caption';caption.setAttribute('aria-label','Play '+(item.title || 'video'));
      const title=document.createElement('span');title.className='rh-card-title';title.textContent=item.title || 'Untitled video';
      const meta=document.createElement('span');meta.className='rh-card-meta';meta.textContent=dateText(item.date)+(item.size ? ' · '+formatBytes(item.size) : '');
      caption.append(title,meta);article.append(frame,caption);

      const toggle=()=>{if(video.paused)attemptPlay(video,playOverlay);else video.pause();};
      playOverlay.addEventListener('click',event=>{event.stopPropagation();toggle();});
      video.addEventListener('click',toggle);
      playButton.addEventListener('click',event=>{event.stopPropagation();toggle();});
      caption.addEventListener('click',()=>{if(video.paused)attemptPlay(video,playOverlay);});
      muteButton.addEventListener('click',event=>{event.stopPropagation();video.muted=!video.muted;});
      volume.addEventListener('input',()=>{video.volume=Number(volume.value);if(video.volume>0)video.muted=false;});
      fullscreen.addEventListener('click',event=>{event.stopPropagation();if(document.fullscreenElement)document.exitFullscreen();else if(frame.requestFullscreen)frame.requestFullscreen();else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();});
      timeline.addEventListener('input',()=>{if(Number.isFinite(video.duration)&&video.duration>0)video.currentTime=(Number(timeline.value)/1000)*video.duration;});
      video.addEventListener('play',()=>{setPlayOverlay(playOverlay,false);playButton.replaceChildren(createIcon('pause'));playButton.setAttribute('aria-label','Pause video');playButton.title='Pause video';});
      video.addEventListener('pause',()=>{playButton.replaceChildren(createIcon('play'));playButton.setAttribute('aria-label','Play video');playButton.title='Play video';if(activeVideo===video)activeVideo=null;});
      video.addEventListener('waiting',()=>{spinner.hidden=false;});
      video.addEventListener('playing',()=>{spinner.hidden=true;});
      video.addEventListener('canplay',()=>{spinner.hidden=true;});
      video.addEventListener('error',()=>{spinner.hidden=true;setPlayOverlay(playOverlay,true);});
      video.addEventListener('timeupdate',()=>{if(video.duration){timeline.value=String(Math.round((video.currentTime/video.duration)*1000));time.textContent=formatTime(video.currentTime)+' / '+formatTime(video.duration);}});
      video.addEventListener('volumechange',()=>{muteButton.replaceChildren(createIcon(video.muted||video.volume===0?'mute':'volume'));muteButton.setAttribute('aria-label',video.muted?'Unmute video':'Mute video');muteButton.title=video.muted?'Unmute video':'Mute video';volume.value=String(video.volume);});
      
      if(observer)observer.observe(article);
      return article;
    }

    function renderFilter(){
      const query=search.value.trim().toLocaleLowerCase();let shown=0;
      grid.querySelectorAll('.rh-card').forEach(card=>{const title=items.get(card.dataset.id)?.title||'';const match=!query||title.toLocaleLowerCase().includes(query);card.style.display=match?'':'none';if(match)shown++;});
      if(query && shown===0 && items.size>0) countLabel.textContent='No videos match your search';
      else countLabel.textContent=items.size+' video'+(items.size===1?'':'s')+' · new uploads appear live';
    }

    async function refreshGallery(){
      if(!apiBase)throw new Error('Missing Google Apps Script Web App URL.');
      const response=await fetch(apiBase,{cache:'no-store'});
      if(!response.ok)throw new Error('Could not load videos from Google Drive.');
      const body=await response.json();
      const videos=Array.isArray(body.videos)?body.videos:[];
      grid.innerHTML = '';
      items.clear();
      videos.forEach(item=>{
        if(!item||item.id==null||!item.url||items.has(String(item.id)))return;
        items.set(String(item.id),item);grid.prepend(createCard(item));
      });
      galleryError.hidden=true;
      renderFilter();
    }

    observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>ratios.set(entry.target.dataset.id,entry.isIntersecting?entry.intersectionRatio:0));
      let bestId=null,bestRatio=0;
      ratios.forEach((ratio,id)=>{if(ratio>bestRatio){bestRatio=ratio;bestId=id;}});
      if(bestId&&bestRatio>=0.58){const card=grid.querySelector('.rh-card[data-id="'+CSS.escape(bestId)+'"]');const video=card&&card.querySelector('.rh-video');const overlay=card&&card.querySelector('.rh-play-overlay');if(video&&video.paused)attemptPlay(video,overlay);else if(video&&activeVideo!==video){pauseAll(video);activeVideo=video;}}
      else if(activeVideo){activeVideo.pause();}
    },{threshold:[0,0.2,0.4,0.58,0.75,0.9,1]});

    function validateFormInputs() {
      return userNameInput.value.trim() && userPhoneInput.value.trim() && userAddressInput.value.trim() && selectedFile !== null;
    }

    function checkSubmitState() { submit.disabled = !validateFormInputs(); }
    [userNameInput, userPhoneInput, userAddressInput].forEach(input => input.addEventListener('input', checkSubmitState));

    function selectFile(file){
      if(!file)return;
      const ext=(file.name.split('.').pop()||'').toLowerCase();
      if(!['mp4','webm','mov'].includes(ext)){setStatus('Please select an MP4, WebM, or MOV video.','error');return;}
      if(file.size>maxBytes){setStatus('This video is over 50 MB. Choose a smaller file.','error');return;}
      selectedFile=file;
      selectedLabel.style.display='block';
      selectedLabel.textContent=file.name+' · '+formatBytes(file.size);
      if(localPreviewUrl)URL.revokeObjectURL(localPreviewUrl);
      localPreviewUrl=URL.createObjectURL(file);
      preview.src=localPreviewUrl;
      preview.style.display='block';
      checkSubmitState();
      setStatus('','');
    }

    function clearFile(){
      selectedFile=null;
      fileInput.value='';
      form.reset();
      submit.disabled=true;
      selectedLabel.style.display='none';
      preview.pause();
      preview.removeAttribute('src');
      preview.load();
      preview.style.display='none';
    }

    drop.addEventListener('click',()=>fileInput.click());
    fileInput.addEventListener('change',()=>selectFile(fileInput.files&&fileInput.files[0]));
    ['dragenter','dragover'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.add('rh-drag');}));
    ['dragleave','drop'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.remove('rh-drag');}));
    drop.addEventListener('drop',e=>selectFile(e.dataTransfer&&e.dataTransfer.files[0]));

    form.addEventListener('submit',event=>{
      event.preventDefault();
      if(!validateFormInputs()) return;

      setStatus('Processing and uploading to Google Drive...', '');
      submit.disabled = true;
      progressWrap.style.display = 'block';
      progressBar.style.width = '50%';
      percent.textContent = 'Uploading...';

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Bytes = e.target.result.split(',')[1];
        const payload = {
          name: userNameInput.value.trim(),
          phone: userPhoneInput.value.trim(),
          address: userAddressInput.value.trim(),
          filename: selectedFile.name,
          mimeType: selectedFile.type || 'video/mp4',
          bytes: base64Bytes
        };

        fetch(apiBase, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(async data => {
          if(data.status === 'success') {
            setStatus('Video uploaded successfully to Google Drive!', 'success');
            clearFile();
            progressBar.style.width = '100%';
            percent.textContent = '100%';
            showView('gallery');
            await refreshGallery();
          } else {
            setStatus('Upload failed: ' + (data.message || 'Unknown error'), 'error');
            submit.disabled = false;
          }
        })
        .catch(err => {
          setStatus('Network error during upload.', 'error');
          submit.disabled = false;
        });
      };
      reader.readAsDataURL(selectedFile);
    });

    refreshGallery().catch(error => {
      galleryError.textContent = error.message || 'Could not load videos.';
      galleryError.hidden = false;
      countLabel.textContent = '';
    });

    window.setInterval(() => refreshGallery().catch(() => {}), 20000);
  })();
  </script>
</body>
</html>

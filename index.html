<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zurich Foundation · Impact Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --zurich-bg: #fdfdfd;
      --zurich-ink: #1a1a1a;
      --zurich-muted: #666666;
      --zurich-primary: #082A68;
      --zurich-accent: #B45A41;
      --zurich-border: #e2e8f0;
      --zurich-card-bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--zurich-bg); color: var(--zurich-ink); font-family: 'Public Sans', sans-serif; font-size: 16px; line-height: 1.6; }
    button, input { font: inherit; }
    #reelhouse-widget { max-width: 1152px; margin: 0 auto; }

    .rh-nav { position: sticky; top: 0; z-index: 40; height: 80px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--zurich-border); background: rgba(255,255,255,.98); backdrop-filter: blur(8px); }
    .rh-brand { display: flex; align-items: center; text-decoration: none; }
    .rh-logo-img { height: 44px; width: auto; display: block; object-fit: contain; }

    .rh-main { padding: 48px 32px 80px; }
    .rh-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .rh-eyebrow { color: var(--zurich-accent); font-size: 13px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .rh-title { margin-top: 6px; font-size: clamp(32px, 4vw, 44px); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; color: var(--zurich-primary); }
    .rh-count { margin-top: 8px; color: var(--zurich-muted); font-size: 14px; font-weight: 500; }

    .rh-search-wrap { position: relative; width: 300px; flex: 0 0 300px; }
    .rh-search-icon { position: absolute; top: 50%; left: 16px; width: 16px; height: 16px; transform: translateY(-50%); color: #777; pointer-events: none; }
    .rh-search { width: 100%; height: 46px; padding: 0 16px 0 44px; border: 1px solid var(--zurich-border); border-radius: 6px; outline: none; background: #fff; color: var(--zurich-ink); font-size: 14px; transition: all .2s ease; }
    .rh-search:focus { border-color: var(--zurich-primary); box-shadow: 0 0 0 3px rgba(8,42,104,0.1); }

    .rh-featured { margin-top: 32px; }
    .rh-feature-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 320px;
      max-height: 640px;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 16px 40px rgba(8,42,104,.08);
      border: 1px solid var(--zurich-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rh-feature-embed {
      position: absolute;
      top: -75px;
      left: 0;
      width: 100%;
      height: calc(100% + 150px);
      border: 0;
      background: #000;
    }

    /* Professional Editorial Layout for Text Submissions */
    .rh-feature-text {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      padding: 56px 64px;
      background: #ffffff;
      color: var(--zurich-ink);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      overflow-y: auto;
    }
    .rh-text-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(180,90,65,0.1);
      color: var(--zurich-accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    .rh-feature-text h3 { font-size: clamp(22px, 2.5vw, 28px); font-weight: 800; color: var(--zurich-primary); margin-bottom: 24px; letter-spacing: -.02em; }
    .rh-qa-block { margin-bottom: 16px; width: 100%; }
    .rh-qa-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--zurich-muted); margin-bottom: 4px; }
    .rh-qa-content { font-size: 16px; font-weight: 400; color: var(--zurich-ink); line-height: 1.6; }

    .rh-fullscreen-btn {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 20;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .rh-fullscreen-btn:hover { background: var(--zurich-accent); }

    .rh-gallery-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-top: 56px; }
    .rh-gallery-title { font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--zurich-primary); }
    .rh-gallery-subtitle { margin-top: 4px; color: var(--zurich-muted); font-size: 14px; }
    .rh-scroll-hint { flex-shrink: 0; color: var(--zurich-muted); font-size: 13px; font-weight: 500; }

    /* Horizontal Cards */
    .rh-grid { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 20px; width: 100%; margin-top: 20px; padding: 8px 4px 24px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    .rh-grid::-webkit-scrollbar { height: 8px; }
    .rh-grid::-webkit-scrollbar-track { background: transparent; }
    .rh-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .rh-card { position: relative; display: block; flex: 0 0 clamp(240px, 26%, 280px); min-width: 0; padding: 12px; border: 1px solid var(--zurich-border); border-radius: 12px; background: var(--zurich-card-bg); color: var(--zurich-ink); text-align: left; cursor: pointer; scroll-snap-align: start; transition: all .2s ease; box-shadow: 0 4px 12px rgba(0,0,0,.02); }
    .rh-card:hover { transform: translateY(-3px); border-color: var(--zurich-primary); box-shadow: 0 10px 25px rgba(8,42,104,.08); }
    .rh-card.is-selected { border-color: var(--zurich-accent); border-width: 2px; background: #fff; box-shadow: 0 10px 25px rgba(180,90,65,.12); }

    .rh-frame { position: relative; width: 100%; overflow: hidden; aspect-ratio: 16 / 9; border-radius: 8px; background: #0f172a; display: flex; align-items: center; justify-content: center; }
    .rh-thumb { display: block; width: 100%; height: 100%; object-fit: cover; border: 0; outline: none; }
    .rh-card-text-preview { padding: 16px; background: #f8fafc; color: var(--zurich-ink); font-size: 13px; line-height: 1.5; width: 100%; height: 100%; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; border-left: 3px solid var(--zurich-accent); }
    .rh-card-badge { position: absolute; right: 10px; bottom: 10px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; background: var(--zurich-primary); color: #fff; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .rh-card.is-selected .rh-card-badge { background: var(--zurich-accent); }

    .rh-card-caption { display: block; width: 100%; margin-top: 12px; padding: 0 4px; }
    .rh-card-title { display: block; overflow: hidden; color: var(--zurich-primary); font-size: 15px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .rh-card-meta { display: block; margin-top: 4px; color: var(--zurich-muted); font-size: 12px; font-weight: 500; }

    .rh-error { margin-top: 24px; padding: 16px; border-radius: 8px; background: #fef2f2; color: #991b1b; font-size: 14px; border: 1px solid #fecaca; }
    .rh-empty { margin-top: 24px; color: var(--zurich-muted); font-size: 14px; }
    [hidden] { display: none !important; }

    @media (max-width: 640px) {
      .rh-nav { height: 64px; padding: 0 16px; }
      .rh-logo-img { height: 34px; }
      .rh-main { padding: 32px 16px 60px; }
      .rh-head { flex-direction: column; align-items: stretch; gap: 16px; }
      .rh-search-wrap { width: 100%; flex-basis: auto; }
      .rh-feature-text { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div id="reelhouse-widget" data-api-base="https://script.google.com/macros/s/AKfycbyHh9H4rI91gZC5SeQiAK-9Qhjl930EX9JDfkJS7aDEJf9lvEuOCcb-BsJyP1Rn3oXy/exec">
    <header class="rh-nav">
      <a class="rh-brand" href="#">
        <img class="rh-logo-img" src="Inside Wall A.png" alt="Zurich Foundation Logo">
      </a>
    </header>

    <main class="rh-main">
      <section class="rh-gallery-view">
        <div class="rh-head">
          <div>
            <p class="rh-eyebrow">Where are you creating change?</p>
            <h1 class="rh-title">Mark your impact</h1>
            <p class="rh-count" aria-live="polite">Loading submissions…</p>
          </div>
          <label class="rh-search-wrap">
            <svg class="rh-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
            <input class="rh-search" type="search" placeholder="Search submissions" aria-label="Search submissions">
          </label>
        </div>

        <section class="rh-featured" aria-label="Featured content">
          <div class="rh-feature-frame" id="rh-feature-frame">
            <iframe class="rh-feature-embed" id="rh-feature-embed" title="Featured video player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            <div class="rh-feature-text" id="rh-feature-text" hidden>
              <div class="rh-text-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                Impact Story Submission
              </div>
              <h3 id="rh-text-title"></h3>
              <div class="rh-qa-block">
                <div class="rh-qa-label">Where creating change</div>
                <div class="rh-qa-content" id="rh-text-change"></div>
              </div>
              <div class="rh-qa-block" style="margin-top: 16px;" id="rh-help-container">
                <div class="rh-qa-label">What would help impact grow</div>
                <div class="rh-qa-content" id="rh-text-help"></div>
              </div>
            </div>
            <button type="button" class="rh-fullscreen-btn" id="rh-fs-btn" aria-label="Maximize screen">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </section>

        <div class="rh-gallery-heading">
          <div>
            <h2 class="rh-gallery-title">Impact stories & submissions</h2>
            <p class="rh-gallery-subtitle">Select an item to feature above.</p>
          </div>
          <p class="rh-scroll-hint">Scroll sideways →</p>
        </div>
        <div class="rh-error" role="alert" hidden></div>
        <div class="rh-grid" aria-label="Submission gallery"></div>
        <p class="rh-empty" hidden>No submissions have been added yet.</p>
      </section>
    </main>
  </div>

  <script>
  (() => {
    const root = document.getElementById('reelhouse-widget');
    if (!root || root.dataset.initialized === '1') return;
    root.dataset.initialized = '1';

    const apiBase = root.dataset.apiBase;
    const grid = root.querySelector('.rh-grid');
    const countLabel = root.querySelector('.rh-count');
    const search = root.querySelector('.rh-search');
    const galleryError = root.querySelector('.rh-error');
    const emptyMessage = root.querySelector('.rh-empty');
    
    const featureEmbed = document.getElementById('rh-feature-embed');
    const featureText = document.getElementById('rh-feature-text');
    const textTitle = document.getElementById('rh-text-title');
    const textChange = document.getElementById('rh-text-change');
    const textHelp = document.getElementById('rh-text-help');
    const helpContainer = document.getElementById('rh-help-container');
    const featureFrame = document.getElementById('rh-feature-frame');
    const fsBtn = document.getElementById('rh-fs-btn');

    const items = new Map();
    let submissionList = [];
    let currentIndex = 0;
    let rotationTimer = null;
    let refreshInProgress = false;

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        featureFrame.requestFullscreen().catch(err => {
          console.warn('Fullscreen error:', err);
        });
      } else {
        document.exitFullscreen();
      }
    });

    function dateText(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function getGoogleDriveId(rawUrl) {
      try {
        if (!rawUrl) return null;
        const url = new URL(rawUrl);
        if (/(^|\.)googleusercontent\.com$/i.test(url.hostname)) {
          const parts = url.pathname.split('/');
          const dIndex = parts.indexOf('d');
          if (dIndex !== -1 && parts[dIndex + 1]) return parts[dIndex + 1];
        }
        if (!/(^|\.)drive\.google\.com$/i.test(url.hostname) && !/(^|\.)docs\.google\.com$/i.test(url.hostname)) {
          return null;
        }
        const pathMatch = url.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (pathMatch) return pathMatch[1];
        const idParam = url.searchParams.get('id');
        if (idParam && /^[a-zA-Z0-9_-]+$/.test(idParam)) return idParam;
        return null;
      } catch (_) {
        return null;
      }
    }

    function highlightCard(id) {
      grid.querySelectorAll('.rh-card').forEach(card => {
        const selected = card.dataset.id === String(id);
        card.classList.toggle('is-selected', selected);
        card.setAttribute('aria-pressed', String(selected));
      });
      const selectedCard = Array.from(grid.querySelectorAll('.rh-card')).find(card => card.dataset.id === String(id));
      if (selectedCard) {
        selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      }
    }

    function selectSubmission(item) {
      if (!item) return;
      const id = String(item.id);
      currentIndex = submissionList.findIndex(v => String(v.id) === id);
      if (currentIndex === -1) currentIndex = 0;

      highlightCard(id);

      const hasVideo = item.url && getGoogleDriveId(item.url);

      if (hasVideo) {
        featureText.hidden = true;
        featureEmbed.hidden = false;
        const driveId = getGoogleDriveId(item.url) || item.id;
        featureEmbed.src = 'https://drive.google.com/file/d/' + encodeURIComponent(driveId) + '/preview?autoplay=1';
      } else {
        featureEmbed.src = '';
        featureEmbed.hidden = true;
        featureText.hidden = false;
        textTitle.textContent = item.title || 'Impact Story';
        textChange.textContent = item.change || 'No details provided.';
        if (item.help) {
          textHelp.textContent = item.help;
          helpContainer.hidden = false;
        } else {
          helpContainer.hidden = true;
        }
      }

      setupRotationTimer();
    }

    function setupRotationTimer() {
      if (rotationTimer) clearInterval(rotationTimer);
      rotationTimer = setInterval(() => {
        if (submissionList.length <= 1) return;
        currentIndex = (currentIndex + 1) % submissionList.length;
        selectSubmission(submissionList[currentIndex]);
      }, 15000);
    }

    function createCard(item) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'rh-card';
      card.dataset.id = String(item.id);
      card.setAttribute('aria-pressed', 'false');
      card.setAttribute('aria-label', 'Select ' + (item.title || 'submission'));

      const frame = document.createElement('div');
      frame.className = 'rh-frame';

      const hasVideo = item.url && getGoogleDriveId(item.url);

      if (hasVideo) {
        const driveId = getGoogleDriveId(item.url) || item.id;
        const img = document.createElement('img');
        img.className = 'rh-thumb';
        img.alt = item.title || 'Video preview';
        img.loading = 'lazy';
        img.src = 'https://lh3.googleusercontent.com/d/' + driveId;
        img.addEventListener('error', () => {
          img.src = 'https://drive.google.com/thumbnail?id=' + driveId + '&sz=w640';
        });

        const playIcon = document.createElement('span');
        playIcon.className = 'rh-card-badge';
        playIcon.textContent = '▶';
        frame.append(img, playIcon);
      } else {
        const textPreview = document.createElement('div');
        textPreview.className = 'rh-card-text-preview';
        textPreview.textContent = item.change || item.title || 'Text Submission';

        const textBadge = document.createElement('span');
        textBadge.className = 'rh-card-badge';
        textBadge.textContent = '✎';
        frame.append(textPreview, textBadge);
      }

      const caption = document.createElement('span');
      caption.className = 'rh-card-caption';

      const title = document.createElement('span');
      title.className = 'rh-card-title';
      title.textContent = item.title || 'Untitled submission';

      const meta = document.createElement('span');
      meta.className = 'rh-card-meta';
      meta.textContent = dateText(item.date) + (hasVideo ? ' · Video reel' : ' · Written story');

      caption.append(title, meta);
      card.append(frame, caption);

      card.addEventListener('click', () => {
        selectSubmission(items.get(card.dataset.id) || item);
      });

      return card;
    }

    function renderFilter() {
      const query = search.value.trim().toLocaleLowerCase();
      let shown = 0;

      grid.querySelectorAll('.rh-card').forEach(card => {
        const item = items.get(card.dataset.id);
        const title = item ? item.title || '' : '';
        const change = item ? item.change || '' : '';
        const help = item ? item.help || '' : '';
        const matches = !query || title.toLocaleLowerCase().includes(query) || change.toLocaleLowerCase().includes(query) || help.toLocaleLowerCase().includes(query);
        card.hidden = !matches;
        if (matches) shown++;
      });

      countLabel.textContent = query && shown === 0
        ? 'No submissions match your search'
        : shown + ' submission' + (shown === 1 ? '' : 's') + ' · Zurich Foundation Gallery';

      emptyMessage.hidden = items.size !== 0;
    }

    search.addEventListener('input', renderFilter);

    async function refreshGallery() {
      if (refreshInProgress) return;
      refreshInProgress = true;

      try {
        if (!apiBase) throw new Error('Missing Google Apps Script Web App URL.');
        const response = await fetch(apiBase, { method: 'GET', cache: 'no-store' });
        if (!response.ok) throw new Error('Could not retrieve submissions.');

        const body = await response.json();
        const submissions = Array.isArray(body.videos) ? body.videos : [];
        submissionList = submissions;
        const incomingIds = new Set();

        submissions.forEach(item => {
          if (!item || item.id == null) return;
          const id = String(item.id);
          incomingIds.add(id);

          if (items.has(id)) {
            items.set(id, item);
            return;
          }

          items.set(id, item);
          grid.appendChild(createCard(item));
        });

        for (const [id] of items) {
          if (!incomingIds.has(id)) {
            const card = Array.from(grid.querySelectorAll('.rh-card')).find(el => el.dataset.id === id);
            if (card) card.remove();
            items.delete(id);
          }
        }

        if (!featureEmbed.src && !featureText.hasAttribute('data-loaded') && submissions.length > 0) {
          featureText.setAttribute('data-loaded', '1');
          selectSubmission(submissions[0]);
        }

        galleryError.hidden = true;
        renderFilter();
      } catch (error) {
        galleryError.textContent = 'Could not load submissions.';
        galleryError.hidden = false;
        countLabel.textContent = 'Unable to load submissions';
      } finally {
        refreshInProgress = false;
      }
    }

    refreshGallery();
    window.setInterval(refreshGallery, 20000);
  })();
  </script>
</body>
</html>
